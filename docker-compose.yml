services:
  jobharbor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobharbor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/jobharbor.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
