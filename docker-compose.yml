services:
  jobharbor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobharbor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/jobharbor.db
      PYTHONPATH: /app/src
      JOBHARBOR_HOME: /app/workspace
      JOBHARBOR_PROFILE_PATH: /app/workspace/config/profile.yml
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./workspace:/app/workspace
