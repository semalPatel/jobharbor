title_filter:
  positive:
    - "AI"
    - "LLM"
  negative:
    - "Junior"
    - "Intern"
  seniority_boost:
    - "Senior"

search_queries:
  - name: Ashby - AI PM
    query: 'site:jobs.ashbyhq.com "AI Product Manager" remote'
    enabled: false
    requires:
      - search
  - name: Greenhouse - AI Engineer
    query: 'site:job-boards.greenhouse.io "AI Engineer" OR "LLM" remote'
    enabled: false
    requires:
      - search
  - name: Lever - Solutions Architect
    query: 'site:jobs.lever.co "Solutions Architect" AI remote'
    enabled: false
    requires:
      - search

tracked_companies:
  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
    provider: greenhouse
    provider_slug: anthropic
    api_url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    scan_method: api
    enabled: true
    notes: AI lab
  - name: Example Ashby Company
    careers_url: https://jobs.ashbyhq.com/example
    provider: ashby
    provider_slug: example
    scan_method: http
    enabled: false
    notes: Enable after replacing with a real company slug.
  - name: Example Lever Company
    careers_url: https://jobs.lever.co/example
    provider: lever
    provider_slug: example
    scan_method: http
    enabled: false
    notes: Enable after replacing with a real company slug.
  - name: Example SmartRecruiters Company
    careers_url: https://jobs.smartrecruiters.com/example
    provider: smartrecruiters
    provider_slug: example
    scan_method: http
    enabled: false
    notes: Enable after replacing with a real company slug.
  - name: Example Browser Company
    careers_url: https://example.com/careers
    provider: custom
    scan_method: browser
    enabled: false
    notes: Browser scanning is intentionally disabled in the MVP.
